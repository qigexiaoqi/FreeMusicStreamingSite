<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="FreeMusicStreamingSite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset="1" stop-color="#05050a"/>
    </linearGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#ffd7e8"/>
      <stop offset=".68" stop-color="#c7b6ff"/>
      <stop offset="1" stop-color="#a9e6ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle cx="120" cy="40" r="230" fill="url(#blobA)" filter="url(#soft)"/>
    <circle cx="1090" cy="60" r="210" fill="url(#blobB)" filter="url(#soft)"/>
    <circle cx="820" cy="360" r="260" fill="url(#blobC)" filter="url(#soft)"/>

    <!-- 网格 -->
    <g stroke="#ffffff" stroke-opacity=".045" stroke-width="1">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
      <path d="M60 0V360M180 0V360M300 0V360M420 0V360M540 0V360M660 0V360M780 0V360M900 0V360M1020 0V360M1140 0V360"/>
    </g>

    <!-- 黑胶 -->
    <g transform="translate(1058 180)">
      <circle r="104" fill="#0b0b12" stroke="#ffffff" stroke-opacity=".1"/>
      <g fill="none" stroke="#ffffff" stroke-opacity=".07">
        <circle r="92"/><circle r="81"/><circle r="70"/><circle r="59"/><circle r="48"/>
      </g>
      <circle r="34" fill="url(#ring)" filter="url(#glow)"/>
      <circle r="6" fill="#05050a"/>
    </g>

    <!-- 文案 -->
    <text x="84" y="110" fill="#ffffff" fill-opacity=".42" font-family="Inter, 'Segoe UI', Arial, sans-serif"
          font-size="13" letter-spacing="8">FREE · LOCAL · MUSIC</text>

    <text x="80" y="192" fill="url(#text)" font-family="Inter, 'Segoe UI', Arial, sans-serif"
          font-size="58" font-weight="800" letter-spacing="0">FreeMusicStreamingSite</text>

    <text x="84" y="244" fill="#ffffff" fill-opacity=".78" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="30" font-weight="600" letter-spacing="6">免费音乐播放站</text>

    <text x="84" y="288" fill="#ffffff" fill-opacity=".38" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
          font-size="16" letter-spacing="3">搜索 · 试听 · 滚动歌词 · 本机下载 · 账号同步 · 管理后台</text>

    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".62">
      <rect x="84" y="306" width="86" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="127" y="325" text-anchor="middle">Python</text>
      <rect x="178" y="306" width="96" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="226" y="325" text-anchor="middle">零依赖</text>
      <rect x="282" y="306" width="96" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="330" y="325" text-anchor="middle">本地部署</text>
    </g>

    <rect x="0" y="0" width="1200" height="360" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  </g>
</svg>
